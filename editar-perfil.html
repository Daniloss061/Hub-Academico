<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar perfil - Hub Acadêmico</title><link rel="stylesheet" href="style.css"></head><body><div class="pagina-interna"><header class="pagina-cabecalho"><a class="voltar" href="perfil.html">‹ Voltar</a><h1>Editar perfil</h1></header><main class="conteudo-pagina"><form class="formulario-pagina" id="formPerfil"><label for="nomePerfil">Nome</label><input id="nomePerfil" required value="Estudante"><label for="bioPerfil">Sobre você</label><textarea id="bioPerfil" placeholder="Conte um pouco sobre você"></textarea><button class="botao-primario" type="submit">Salvar alterações</button><p id="msgPerfil" class="mensagem-pagina"></p></form></main></div><script>document.getElementById("formPerfil").addEventListener("submit",function(e){e.preventDefault();localStorage.setItem("hubNome",document.getElementById("nomePerfil").value);localStorage.setItem("hubBio",document.getElementById("bioPerfil").value);document.getElementById("msgPerfil").textContent="Alterações salvas neste navegador.";});</script></body></html>
