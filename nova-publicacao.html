<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nova publicação - Hub Acadêmico</title><link rel="stylesheet" href="style.css"></head><body><div class="pagina-interna"><header class="pagina-cabecalho"><a class="voltar" href="principal.html">‹ Voltar</a><h1>Nova publicação</h1></header><main class="conteudo-pagina"><p>Compartilhe um material, aviso ou oportunidade com a comunidade acadêmica.</p><form class="formulario-pagina" id="formPublicacao"><label for="tituloPost">Título</label><input id="tituloPost" required maxlength="100" placeholder="Ex.: Resumo de Banco de Dados"><label for="categoriaPost">Categoria</label><select id="categoriaPost"><option>Materiais de estudo</option><option>Estágios</option><option>Grupos</option><option>Eventos</option><option>Avisos</option></select><label for="textoPost">Descrição</label><textarea id="textoPost" required maxlength="1000" placeholder="Escreva sua publicação..."></textarea><button class="botao-primario" type="submit">Publicar</button><p id="msgPost" class="mensagem-pagina"></p></form></main></div><script>document.getElementById("formPublicacao").addEventListener("submit",function(e){e.preventDefault();const post={titulo:document.getElementById("tituloPost").value.trim(),categoria:document.getElementById("categoriaPost").value,texto:document.getElementById("textoPost").value.trim(),data:new Date().toLocaleString("pt-BR")};const posts=JSON.parse(localStorage.getItem("hubPublicacoes")||"[]");posts.unshift(post);localStorage.setItem("hubPublicacoes",JSON.stringify(posts));document.getElementById("msgPost").textContent="Publicação salva neste navegador!";setTimeout(()=>location.href="confirmacao.html",700);});</script></body></html>
