<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvos - Hub Acadêmico</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pagina-interna">
<header class="pagina-cabecalho"><a class="voltar" href="principal.html" aria-label="Voltar">‹ Voltar</a><h1>Salvos</h1></header>
<main class="conteudo-pagina">
<p>Encontre aqui os conteúdos que você marcou para consultar depois.</p>
<div id="listaSalvos"></div>
</main>
    <nav class="menu">
      <a href="principal.html" ><span>⌂</span>Início</a>
      <a href="explorar.html" ><span>🔍</span>Explorar</a>
      <a href="salvos.html" class='ativo'><span>🗂️</span>Salvos</a>
      <a href="perfil.html" ><span>♙</span>Perfil</a>
    </nav>
</div>
<script src="hub.js"></script>
<script>
(function(){
  var box=document.getElementById("listaSalvos"), lista=Hub.salvos();
  if(!lista.length){
    box.appendChild(Hub.estadoVazio("🔖","Nenhum item salvo por enquanto","Toque em 🔖 em qualquer publicação para guardá-la aqui."));
    var a=Hub.el("a","botao-primario","Explorar publicações"); a.href="explorar.html"; a.style.marginTop="14px"; box.appendChild(a);
    return;
  }
  lista.forEach(function(p){ box.appendChild(Hub.cartao(p)); });
})();
</script>
</body></html>
