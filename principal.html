<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hub Acadêmico</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="principal">

        <!-- CABEÇALHO -->
        <header class="topo">

            <h1>Hub Acadêmico</h1>

            <a class="notificacao icone-link" href="notificacoes.html" aria-label="Notificações">🔔</a>

        </header>

        <!-- PESQUISA -->
        <form class="pesquisa" action="explorar.html" method="get">
            <input name="busca" type="search" placeholder="Pesquisar publicações..." aria-label="Pesquisar publicações">
            <button type="submit" class="botao-pesquisar" aria-label="Pesquisar">🔍</button>
        </form>

        <!-- CATEGORIAS -->
        <section class="categorias">

            <div class="titulo">

                <h2>Categorias</h2>

                <a href="categorias.html">Ver todas</a>

            </div>

            <div class="lista-categorias">

                <a class="categoria categoria-link" href="materiais.html">
                    <div class="icone-categoria">📚</div>
                    <span>Materiais</span>
                </a>

                <a class="categoria categoria-link" href="estagios.html">
                    <div class="icone-categoria">💼</div>
                    <span>Estágios</span>
                </a>

                <a class="categoria categoria-link" href="grupos.html">
                    <div class="icone-categoria">👥</div>
                    <span>Grupos</span>
                </a>

                <a class="categoria categoria-link" href="eventos.html">
                    <div class="icone-categoria">📅</div>
                    <span>Eventos</span>
                </a>

            </div>

        </section>

        <!-- EM ALTA -->
        <section class="publicacoes destaques-secao" aria-labelledby="tituloAlta">
            <h2 id="tituloAlta">🔥 Em alta esta semana</h2>
            <div class="destaques" id="destaques"></div>
        </section>

        <!-- PUBLICAÇÕES -->
        <section class="publicacoes" id="feed" aria-label="Publicações">
            <h2>Publicações</h2>

            <div class="controles-feed">
                <div class="chips" id="filtroCategorias" role="group" aria-label="Filtrar por categoria"></div>
                <div class="segmentado" id="ordenacao" role="group" aria-label="Ordenar publicações"></div>
            </div>

            <p class="contagem-feed" id="contagemFeed" aria-live="polite"></p>
            <div id="listaFeed"></div>
            <nav class="pager" id="pager" aria-label="Paginação"></nav>
        </section>

        <!-- BOTÃO DE NOVA PUBLICAÇÃO -->
        <a class="botao-adicionar botao-adicionar-link" href="nova-publicacao.html" aria-label="Criar publicação">+</a>

        <!-- MENU INFERIOR -->
        <nav class="menu">

            <a href="principal.html" class="ativo">
                <span>⌂</span>
                Início
            </a>

            <a href="explorar.html">
                <span>🔍</span>
                Explorar
            </a>

            <a href="salvos.html">
                <span>🗂️</span>
                Salvos
            </a>

            <a href="perfil.html">
                <span>♙</span>
                Perfil
            </a>

        </nav>

    </div>
    <script src="hub.js"></script>
    <script src="feed.js"></script>
</body>
</html>
